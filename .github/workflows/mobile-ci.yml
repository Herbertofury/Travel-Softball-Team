name: Mobile app validation
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'site.config.js', 'assets/**', 'worker/**', 'db/**', 'drizzle/**', 'tests/**', 'package*.json', 'scripts/**', '.github/workflows/mobile-ci.yml', '!mobile/**/*.md']
  pull_request:
    paths: ['mobile/**', 'site.config.js', 'assets/**', 'worker/**', 'db/**', 'drizzle/**', 'tests/**', 'package*.json', 'scripts/**', '.github/workflows/mobile-ci.yml', '!mobile/**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '24', cache: npm, cache-dependency-path: 'package-lock.json'}
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm run build
      - run: npm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '24', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - uses: actions/setup-java@v6.0.1
        with: {distribution: temurin, java-version: '21'}
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-36'' ''build-tools;36.0.0'' ''build-tools;35.0.0'''
      - run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: aftershock-android-test-and-release-bundle
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '24', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
      - uses: actions/upload-artifact@v7.0.1
        with: {name: aftershock-ios-simulator, path: mobile/build/ios/Build/Products/Debug-iphonesimulator/}
